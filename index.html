<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>党章考试在线练习</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#b42318">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/home" aria-label="返回首页">
      <span class="brand-mark">党</span>
      <span>
        <strong>党章考试在线练习</strong>
        <small>单选、填空、简答、论述一站式考前复习</small>
      </span>
    </a>
    <nav class="top-nav" aria-label="主导航">
      <a href="#/home" data-route="home">首页</a>
      <a href="#/chapters" data-route="chapters">章节练习</a>
      <a href="#/practice" data-route="practice">练习</a>
      <a href="#/exam" data-route="exam">模拟考试</a>
      <a href="#/wrong" data-route="wrong">错题本</a>
      <a href="#/favorites" data-route="favorites">收藏</a>
      <a href="#/cards" data-route="cards">速背</a>
      <a href="#/search" data-route="search">搜索</a>
      <a href="#/profile" data-route="profile">个人中心</a>
    </nav>
    <div class="user-area">
      <span id="sync-status" class="sync-pill">本地模式</span>
      <a id="auth-entry" class="btn small" href="#/login">登录/注册</a>
    </div>
  </header>

  <main id="app" class="page-shell" tabindex="-1"></main>

  <footer class="site-footer">
    <div>
      <strong>党章考试在线练习</strong>
      <p>本站用于入党积极分子和党章考试复习，支持本地练习和登录同步。</p>
    </div>
    <p>本地模式下，学习记录只保存在当前浏览器；登录后可同步到已配置的 Supabase。<span id="app-version">v1.2.0</span></p>
  </footer>

  <nav class="bottom-nav" aria-label="移动端导航">
    <a href="#/home">首页</a>
    <a href="#/chapters">练习</a>
    <a href="#/exam">考试</a>
    <a href="#/wrong">错题</a>
    <a href="#/profile">我的</a>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="update-toast" class="update-toast" hidden>
    <span>发现新版本</span>
    <button type="button" id="reload-app">刷新</button>
  </div>

  <input id="import-file" type="file" accept="application/json,.json" hidden>

  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
